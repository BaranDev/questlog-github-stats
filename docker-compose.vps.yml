services:
  questlog:
    build: .
    container_name: questlog
    restart: unless-stopped
    expose: ["8080"]
    networks: [edge]
    mem_limit: 1g        # the render cache holds up to 256 MB of finished cards
    cpus: "1.0"          # a render storm can't starve the other apps on the box
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    volumes:
      - questlog-data:/data

volumes:
  questlog-data: {}

networks:
  edge:
    external: true
