[package]
name = "questlog"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.9"
png = "0.18.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
skrifa = "0.48.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"
