<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>questlog</title>
<style>
  :root { --bg: #16130f; --panel: #221c16; --fg: #f2e6c9; --muted: #b9a888; --line: #3d3226; --gold: #f5dea0; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4ecd8; --panel: #fffaf0; --fg: #2a2118; --muted: #6b5d4c; --line: #d9cfbb; --gold: #8a5a12; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 Georgia, serif; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { color: var(--gold); margin: 0 0 4px; letter-spacing: 1px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: var(--panel); border: 1px solid var(--line); padding: 16px; border-radius: 8px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
  input, select, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button { background: var(--gold); color: #1c120a; border: 0; cursor: pointer; }
  .checks { flex-direction: row; gap: 12px; align-items: center; }
  section { margin-top: 28px; }
  h2 { font-size: 18px; color: var(--gold); margin: 0 0 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pair img { width: 100%; image-rendering: pixelated; border-radius: 4px; background: var(--panel); min-height: 60px; }
  textarea { width: 100%; box-sizing: border-box; height: 120px; margin-top: 8px; font: 13px/1.4 ui-monospace, monospace; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  @media (max-width: 600px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>questlog</h1>
  <p class="sub">Pixel-art cards for your GitHub profile. Type your login, preview, copy.</p>
  <form id="f">
    <label>GitHub login <input id="user" required pattern="[A-Za-z0-9-]{1,39}" placeholder="octocat"></label>
    <label>Scene <select id="scene"></select></label>
    <label class="checks">
      <span><input type="checkbox" name="w" value="stats" checked> Stats</span>
      <span><input type="checkbox" name="w" value="languages" checked> Languages</span>
      <span><input type="checkbox" name="w" value="streak" checked> Streak</span>
    </label>
    <button>Preview</button>
  </form>
  <div id="out"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
fetch("/health").then((r) => r.json()).then((h) => {
  for (const s of h.scenes) $("scene").add(new Option(s[0].toUpperCase() + s.slice(1), s));
});

// Loads a card; while the server answers with the "inking" placeholder, shows it and retries every 5 s.
async function load(img, url) {
  for (let i = 0; i < 40; i++) {
    const res = await fetch(url, { cache: "no-store" });
    img.src = URL.createObjectURL(await res.blob());
    if (res.headers.get("x-questlog") !== "placeholder") return;
    await new Promise((r) => setTimeout(r, 5000));
  }
}

$("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const user = $("user").value.trim(), scene = $("scene").value, base = location.origin;
  $("out").innerHTML = "";
  for (const box of document.querySelectorAll("input[name=w]:checked")) {
    const w = box.value, q = `user=${encodeURIComponent(user)}&scene=${scene}`;
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>${box.parentElement.textContent.trim()}</h2><div class="pair"><img alt="day"><img alt="night"></div><textarea readonly></textarea>`;
    const [day, night] = sec.querySelectorAll("img");
    load(day, `${base}/${w}?${q}&time=day`);
    load(night, `${base}/${w}?${q}&time=night`);
    sec.querySelector("textarea").value =
`<picture>
  <source media="(prefers-color-scheme: dark)" srcset="${base}/${w}?${q}&time=night">
  <img alt="${user}'s ${w}" src="${base}/${w}?${q}&time=day">
</picture>`;
    $("out").append(sec);
  }
});
</script>
</body>
</html>
